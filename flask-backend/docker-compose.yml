services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://sentinel:${POSTGRES_PASSWORD}@db:5432/sentinel
      UPLOAD_FOLDER: /srv/sentinel/instance/private_uploads
      COOKIE_SECURE: "true"
      FLASK_DEBUG: "false"
      DEMO_LOGIN_ENABLED: "false"
      OTP_PROVIDER: ${OTP_PROVIDER:-unconfigured}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/srv/sentinel/instance/private_uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
