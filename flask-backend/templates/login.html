
{% extends "base.html" %}

{% block title %}Sign in{% endblock %}

{% block content %}
<section class="formcard">
    <p class="eyebrow">SECURE ACCESS</p>

    <h1>Sign in</h1>

    <form method="post">
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <label>
            Email or phone
            <input
                type="text"
                name="identifier"
                required
                autocomplete="username"
            >
        </label>

        <label>
            Password
            <input
                type="password"
                name="password"
                required
                autocomplete="current-password"
            >
        </label>

        <button type="submit" class="btn">Sign in</button>
    </form>

    <p class="small">
        Local demo users can be seeded using the CLI. See README.
    </p>
</section>
{% endblock %}
